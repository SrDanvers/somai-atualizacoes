name: Capturar Somaí Android 1.9.15 para o site

on:
  push:
    branches: [somai-capturas-1915]
    paths:
      - .github/workflows/capturar-1915-site.yml
      - .github/scripts/capturar-somai-1915-site.sh

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Conferir o APK oficial
        run: |
          mkdir -p capturas-site
          curl -fsSL --retry 3 -o Somai-1.9.15.apk \
            https://github.com/SrDanvers/somai-atualizacoes/releases/download/v1.9.15/Somai-1.9.15.apk
          echo '012ab2ccf9cf5afebc5b87ef37c15ae838a7f7a9e6f29ce41ef66974778dc5e9  Somai-1.9.15.apk' | sha256sum -c -

      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Executar o APK em um Android limpo
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/capturar-somai-1915-site.sh

      - name: Entregar os arquivos de captura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: somai-1915-capturas-reais
          path: capturas-site/
          if-no-files-found: error
          retention-days: 7
