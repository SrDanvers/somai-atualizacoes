name: Somaí - Publicar atualização do APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Conferir APK e atualizar update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          release = event.get("release")
          if not release:
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "somai-updater"
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  release = json.load(response)

          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("Esta release nao e definitiva; atualizacao nao publicada.")

          tag = release.get("tag_name", "")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("A tag deve seguir o formato v1.9.3")

          description = re.sub(r"[*_`]", "", release.get("body") or "")
          code_match = re.search(
              r"(?im)^\s*(?:versioncode|c[oó]digo(?: da vers[aã]o)?)\s*:\s*(\d+)\s*$",
              description,
          )
          if not code_match:
              raise SystemExit("Na descricao da release inclua: Codigo: 14 (exemplo).")
          code = int(code_match.group(1))

          apks = [a for a in release.get("assets", []) if a.get("name", "").lower().endswith(".apk")]
          if len(apks) != 1:
              raise SystemExit("A release precisa ter exatamente um arquivo APK.")

          apk = apks[0]
          digest = apk.get("digest") or ""
          if not re.fullmatch(r"sha256:[a-fA-F0-9]{64}", digest):
              raise SystemExit("O GitHub nao informou um SHA-256 valido para o APK.")
          if apk.get("state") != "uploaded":
              raise SystemExit("O envio do APK ainda nao foi concluido.")

          p = Path("update.json")
          current = json.loads(p.read_text(encoding="utf-8"))
          if current.get("applicationId") != "br.com.denny.somai":
              raise SystemExit("applicationId inesperado: operacao cancelada.")
          old_code = int(current.get("latestVersionCode", 0))
          if code <= old_code:
              print(f"Sem mudanca: versao publicada {code} <= {old_code}.")
              raise SystemExit(0)

          notes = [line[2:].strip() for line in description.splitlines() if line.strip().startswith("- ")]
          updated = {
              "schemaVersion": 1,
              "applicationId": "br.com.denny.somai",
              "enabled": True,
              "latestVersionCode": code,
              "latestVersionName": tag[1:],
              "apkUrl": apk["browser_download_url"],
              "apkSha256": digest.split(":", 1)[1].lower(),
              "releaseNotes": "; ".join(notes)[:800] or (release.get("name") or tag),
              "publishedAt": release.get("published_at") or "",
          }
          p.write_text(json.dumps(updated, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Atualizacao {tag}, codigo {code}, preparada.")
          PY

      - name: Salvar manifesto na branch main
        shell: bash
        run: |
          if git diff --quiet -- update.json; then
            echo "Manifesto ja atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Somaí: atualizar manifesto para a nova release"
          git push origin HEAD:main
