name: Limpar release antiga Somaí 2.0.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/limpar-release-somai-201.yml"

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Remover release e tag v2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release delete "v2.0.1" --repo "$GH_REPO" --cleanup-tag --yes || true
          if gh release view "v2.0.1" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "A release v2.0.1 ainda existe."
            exit 1
          fi
          echo "Release/tag v2.0.1 removidas."
